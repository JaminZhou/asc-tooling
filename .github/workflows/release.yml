name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify
        run: |
          bundle exec ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |f| load f }'
          bundle exec rubocop
          ruby .github/scripts/validate_skill.rb

      - name: Build gem
        run: gem build asc_tooling.gemspec

      - name: Upload gem artifact
        uses: actions/upload-artifact@v6
        with:
          name: gem
          path: asc_tooling-*.gem

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: asc_tooling-*.gem
